openapi: 3.0.3
info:
  title: Task Manager API
  version: 1.0.0
servers:
  - url: https://api.example.com/api/v1
paths:
  /tasks:
    get:
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Current user's paginated tasks
        "401":
          description: Missing or invalid access token
    post:
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Task created
        "400":
          description: Invalid request
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
